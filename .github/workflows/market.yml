name: market-engine

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "brief | scan | wrap"
        default: "brief"
  schedule:
    # Times in UTC. CDT = UTC-5 (shift these +1h after November DST change).
    - cron: "15 13 * * 1-5"       # 8:15 AM CT  -> morning brief
    - cron: "*/30 13-20 * * 1-5"  # market hours -> alert scan every 30 min
    - cron: "30 1 * * 2-6"        # 8:30 PM CT  -> evening wrap

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "15 13 * * 1-5" ]; then
            MODE=brief
          elif [ "${{ github.event.schedule }}" = "30 1 * * 2-6" ]; then
            MODE=wrap
          else
            MODE=scan
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run engine (${{ steps.mode.outputs.mode }})
        run: python engine.py --mode ${{ steps.mode.outputs.mode }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit alert state (dedupe memory)
        run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git commit -m "chore: alert state" || echo "no state change"
          git push || echo "push skipped"
